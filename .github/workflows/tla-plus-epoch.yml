---
name: TLA+ Epoch Model

on:
  pull_request:
    paths:
      - 'models/epoch/**'
      - 'models/epoch_hot_add/**'
      - 'libs/runtime/ebpf_epoch.c'
      - 'libs/runtime/ebpf_epoch.h'
      - '.github/workflows/tla-plus-epoch.yml'
  push:
    branches:
      - main
    paths:
      - 'models/epoch/**'
      - 'models/epoch_hot_add/**'
      - 'libs/runtime/ebpf_epoch.c'
      - 'libs/runtime/ebpf_epoch.h'
      - '.github/workflows/tla-plus-epoch.yml'

permissions:
  contents: read

jobs:
  tlc:
    name: TLC model check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Download tla2tools.jar
        run: |
          curl -fsSL -o tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar

      - name: TLC fixed config must pass
        run: |
          java -XX:+UseParallelGC -cp tla2tools.jar tlc2.TLC -workers auto \
            -config models/epoch/EpochModel.cfg \
            models/epoch/EpochModel.tla

      - name: TLC buggy config must fail (find counterexample)
        shell: bash
        run: |
          set +e
          java -XX:+UseParallelGC -cp tla2tools.jar tlc2.TLC -workers auto \
            -config models/epoch/EpochModel_buggy.cfg \
            models/epoch/EpochModel.tla \
            > tlc-buggy.out 2>&1
          status=$?
          cat tlc-buggy.out

          if [ "$status" -eq 0 ]; then
            echo "Buggy model unexpectedly passed"
            exit 1
          fi

          if ! grep -q "Invariant Safety is violated" tlc-buggy.out; then
            echo "Buggy model failed, but did not report a Safety invariant violation"
            exit 1
          fi

      - name: TLC hot-add fixed config must pass
        run: |
          java -XX:+UseParallelGC -cp tla2tools.jar tlc2.TLC -workers auto \
            -config models/epoch_hot_add/EpochHotAddModel.cfg \
            models/epoch_hot_add/EpochHotAddModel.tla

      - name: TLC hot-add buggy configs must fail
        shell: bash
        run: |
          set -euo pipefail

          for cfg in \
            models/epoch_hot_add/EpochHotAddModel_buggy_no_quiesce.cfg \
            models/epoch_hot_add/EpochHotAddModel_buggy_early_resume.cfg; do
            out="${cfg}.out"

            set +e
            java -XX:+UseParallelGC -cp tla2tools.jar tlc2.TLC -workers auto \
              -config "${cfg}" \
              models/epoch_hot_add/EpochHotAddModel.tla \
              > "${out}" 2>&1
            status=$?
            set -e

            cat "${out}"

            if [ "$status" -eq 0 ]; then
              echo "Buggy model unexpectedly passed: ${cfg}"
              exit 1
            fi

            if ! grep -q "Invariant" "${out}"; then
              echo "Buggy model failed, but did not report an invariant violation: ${cfg}"
              exit 1
            fi
          done
