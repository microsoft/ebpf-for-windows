#
# The internal release validation pipeline builds only the `tools\driver-test` target
# rather than the full solution. A binary or script the driver validation tests launch at
# run time but that is missing from that target's project closure is not caught by any
# build; it surfaces much later as an opaque "The system cannot find the file specified"
# test failure. This workflow runs a static (build-free) closure check to catch it in PR.
---
name: Validate-Driver-Test-Closure

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  validate-driver-test-closure:
    runs-on: windows-2022

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false

      - name: Check driver-test build closure
        run: .\scripts\check_driver_test_closure.ps1
        shell: pwsh
