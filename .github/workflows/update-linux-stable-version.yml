name: Update stable Linux version

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-linux-stable-version
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'microsoft/ebpf-for-windows'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Read latest stable Linux version
        id: stable
        shell: bash
        run: |
          set -euo pipefail

          version=$(
            curl \
              --fail \
              --location \
              --retry 3 \
              'https:'"//www.kernel.org/releases.json" |
              jq \
                --raw-output \
                '.latest_stable.version'
          )

          [[ $version =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]

          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Read matching archive checksum
        id: checksum
        shell: bash
        env:
          VERSION: ${{ steps.stable.outputs.version }}
        run: |
          set -euo pipefail

          major_version=${VERSION%%.*}
          base="https:""//cdn.kernel.org/pub/linux/kernel/v${major_version}.x"
          checksums=$(curl --fail --location --retry 3 "$base/sha256sums.asc")
          entry=$(
            printf '%s\n' "$checksums" |
              awk -v name="linux-$VERSION.tar.xz" '$2 == name {print $1 "  " $2}'
          )
          [[ "$entry" =~ ^[0-9a-f]{64}"  linux-$VERSION.tar.xz"$ ]]
          echo "entry=$entry" >>"$GITHUB_OUTPUT"

      - name: Update pinned version and checksum
        shell: bash
        env:
          VERSION: ${{ steps.stable.outputs.version }}
          CHECKSUM: ${{ steps.checksum.outputs.entry }}
        run: |
          set -euo pipefail

          printf '%s\n' "$VERSION" \
            >.github/linux-stable-version.txt
          printf '%s\n' "$CHECKSUM" >.github/linux-stable.sha256

      - name: Propose stable Linux version update
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            .github/linux-stable-version.txt
            .github/linux-stable.sha256
          branch: automation/update-linux-stable-version
          base: ${{ github.event.repository.default_branch }}
          commit-message: "ci: update stable Linux kernel to ${{ steps.stable.outputs.version }}"
          title: "ci: update stable Linux kernel to ${{ steps.stable.outputs.version }}"
          body: |
            Proposes an update to the stable Linux behavioral baseline.

            Review the pin change and require successful Linux/Windows behavior
            comparison checks before merging. Approve the PR workflow runs if
            GitHub requires approval; missing checks are not a passing result.
          draft: true
