# This is a workflow which runs the performance tests with profiling enabled.
---
name: Performance Tests on netperf

on:
  # Permit manual runs of the workflow.
  workflow_call:
    inputs:
      sha:
        description: 'SHA of the commit'
        required: true
        type: string
      ref:
        description: 'Ref of the commit'
        required: true
        type: string
      pull_request:
        description: 'Pull request number'
        required: true
        type: string
    secrets:
      NET_PERF_TRIGGER:
        description: 'Token to trigger the NetPerf workflow'
        required: true

permissions:
  contents: read
  issues: write  # Required to create issues.
  projects: write  # Required to set Type=Bug on project items.

jobs:
  netperf:
    runs-on: windows-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Run NetPerf Workflow
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $url = "https://raw.githubusercontent.com/microsoft/netperf/main/run-workflow.ps1"
          if ('${{ secrets.NET_PERF_TRIGGER }}' -eq '') {
              Write-Host "Not able to run because no secrets are available!"
              return
          }
          $run_id = iex "& { $(irm $url) } ${{ secrets.NET_PERF_TRIGGER }} ebpf ${{ inputs.sha }} ${{ inputs.ref }} ${{ inputs.pull_request.number }}"
          echo "NetPerf run id: $run_id"
          gh run download $run_id --dir netperf --pattern ebpf* --repo microsoft/netperf

      - name: upload_results_azure_2022_x64
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: Test-Logs-netperf_azure_2022_x64
          path: netperf/ebpf_azure_2022_x64/ebpf.csv

      - name: upload_results_lab_2022_x64
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: Test-Logs-netperf_lab_2022_x64
          path: netperf/ebpf_lab_2022_x64/ebpf.csv

  create_or_update_issue:
    needs: netperf
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578  # v5.3.2
        with:
          cancel_others: 'false'
          paths_ignore: '["**.md", "**/docs/**"]'

      # Note: Simplified condition compared to reusable-test.yml because netperf
      # is only called from cicd.yml on schedule/workflow_dispatch events.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        if: steps.skip_check.outputs.should_skip != 'true'
        env:
          TITLE: Workflow failed - netperf
          BODY: |
            [Failed Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            [Codebase](https://github.com/${{ github.repository }}/tree/${{ github.sha }})
            Test name - `netperf`
          LABELS: ci/cd

        with:
          script: |
            const owner = process.env.GITHUB_REPOSITORY.split('/')[0]
            const repo = process.env.GITHUB_REPOSITORY.split('/')[1]
            const body = process.env.BODY;
            const title = process.env.TITLE;
            const labels = process.env.LABELS;
            const label_array = labels ? labels.split(',') : [];
            console.log(label_array);
            async function set_issue_type_bug(issue_node_id) {
              try {
                const projects_response = await github.graphql(
                  `query($owner: String!, $repo: String!) {
                    repository(owner: $owner, name: $repo) {
                      projectsV2(first: 20) {
                        nodes {
                          id
                          title
                        }
                      }
                    }
                  }`,
                  {owner, repo});
                const issue_response = await github.graphql(
                  `query($issueId: ID!) {
                    node(id: $issueId) {
                      ... on Issue {
                        projectItems(first: 100) {
                          nodes {
                            id
                            project {
                              id
                            }
                          }
                        }
                      }
                    }
                  }`,
                  {issueId: issue_node_id});
                const existing_items = new Map(
                  issue_response.node.projectItems.nodes.map((item) => [item.project.id, item.id]));
                for (const project of projects_response.repository.projectsV2.nodes) {
                  const fields_response = await github.graphql(
                    `query($projectId: ID!) {
                      node(id: $projectId) {
                        ... on ProjectV2 {
                          fields(first: 50) {
                            nodes {
                              ... on ProjectV2SingleSelectField {
                                id
                                name
                                options {
                                  id
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }`,
                    {projectId: project.id});
                  const type_field = fields_response.node.fields.nodes.find((field) => field.name === 'Type');
                  const bug_option = type_field?.options?.find((option) => option.name === 'Bug');
                  if (!type_field || !bug_option) {
                    continue;
                  }
                  let item_id = existing_items.get(project.id);
                  if (!item_id) {
                    const add_response = await github.graphql(
                      `mutation($projectId: ID!, $issueId: ID!) {
                        addProjectV2ItemById(input: {projectId: $projectId, contentId: $issueId}) {
                          item {
                            id
                          }
                        }
                      }`,
                      {projectId: project.id, issueId: issue_node_id});
                    item_id = add_response.addProjectV2ItemById.item.id;
                  }
                  await github.graphql(
                    `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                      updateProjectV2ItemFieldValue(input: {
                        projectId: $projectId,
                        itemId: $itemId,
                        fieldId: $fieldId,
                        value: {singleSelectOptionId: $optionId}
                      }) {
                        projectV2Item {
                          id
                        }
                      }
                    }`,
                    {
                      projectId: project.id,
                      itemId: item_id,
                      fieldId: type_field.id,
                      optionId: bug_option.id
                    });
                  console.log(`Set Type=Bug for issue node ${issue_node_id} in project ${project.title}`);
                }
              } catch (error) {
                console.log(`Unable to set Type=Bug for issue node ${issue_node_id}: ${error.message}`);
              }
            }
            // Get all issues that have these labels.
            const opts = github.rest.issues.listForRepo.endpoint.merge({
              ...context.issue,
              state: 'open',
              labels: label_array,
            });
            const issues = await github.paginate(opts);
            // Look for an existing issue with the same title.
            for (const issue of issues) {
              if (issue.title === title) {
                console.log(`Updating issue ${title}`);
                await github.rest.issues.createComment({
                  issue_number: issue.number,
                  owner,
                  repo,
                  body,
                });
                await set_issue_type_bug(issue.node_id);
                return;
              }
            }
            // Existing issue not found, create a new one.
            console.log(`Creating issue ${title}`);
            const created_issue = await github.rest.issues.create({
              owner: owner,
              repo: repo,
              title: title,
              body: body,
              labels: label_array,
            });
            await set_issue_type_bug(created_issue.data.node_id);
