# This workflow checks for Windows Driver Kit updates and files issues when updates are needed.
---

name: Check for updates to the Windows Driver Kit

on:
  # Run script every Sunday at midnight
  schedule:
    - cron: '0 0 * * 0'
  # Allow manual triggering of the script
  workflow_dispatch:

permissions:
  contents: read  # Required by actions/checkout to fetch code.
  issues: write  # Required to create issues.
  projects: write  # Required to set Type=Task on project items.

jobs:
  check:
    runs-on: windows-2025
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Check for updates to the Windows Driver Kit
        id: check_wdk
        run: |
          # Get the latest version of the Windows Driver Kit
          $packageVersion = .\scripts\Get-LatestNugetPackageVersion.ps1 -PackageName "Microsoft.Windows.WDK.x64"
          "wdk_version=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Check the version of the WDK in the repo
        id: check_repo_wdk
        run: |
          # wdk.props declares one <WDKVersion> per supported Visual Studio version. Read the
          # one selected for VS 2026 (MSBuildToolsVersion >= 18.0), which is the version the
          # repo builds and ships with by default.
          $props = Get-Content -Raw -Path .\wdk.props
          $match = [regex]::Match($props, "<WDKVersion[^>]*&gt;=\s*'18\.0'[^>]*>([^<]+)</WDKVersion>")
          if (-not $match.Success) {
            throw "Could not determine the VS 2026 WDK version from wdk.props."
          }
          $wdkVersion = $match.Groups[1].Value.Trim()
          "wdk_version=$wdkVersion" >> $env:GITHUB_OUTPUT

      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        if: steps.check_wdk.outputs.wdk_version != steps.check_repo_wdk.outputs.wdk_version
        env:
          TITLE: 'Update the Windows Driver Kit'
          BODY: |
            The Windows Driver Kit version in the repository does not match the latest version available on NuGet. Please update the WDK version in the repository to match the latest version available on NuGet.
            The latest version is ${{steps.check_wdk.outputs.wdk_version}} and the version in the repository is ${{steps.check_repo_wdk.outputs.wdk_version}}.
            To update the WDK run the following command:
            ```powershell
            .\scripts\Update-WdkVersion.ps1
            ```
          LABELS: ci/cd
        with:
          script: |
            const owner = process.env.GITHUB_REPOSITORY.split('/')[0]
            const repo = process.env.GITHUB_REPOSITORY.split('/')[1]
            const body = process.env.BODY;
            const title = process.env.TITLE;
            const labels = process.env.LABELS;
            const label_array = labels ? labels.split(',') : [];
            console.log(label_array);
            async function set_issue_type_task(issue_node_id) {
              try {
                const projects_response = await github.graphql(
                  `query($owner: String!, $repo: String!) {
                    repository(owner: $owner, name: $repo) {
                      projectsV2(first: 20) {
                        nodes {
                          id
                          title
                        }
                      }
                    }
                  }`,
                  {owner, repo});
                const issue_response = await github.graphql(
                  `query($issueId: ID!) {
                    node(id: $issueId) {
                      ... on Issue {
                        projectItems(first: 100) {
                          nodes {
                            id
                            project {
                              id
                            }
                          }
                        }
                      }
                    }
                  }`,
                  {issueId: issue_node_id});
                const existing_items = new Map(
                  issue_response.node.projectItems.nodes.map((item) => [item.project.id, item.id]));
                for (const project of projects_response.repository.projectsV2.nodes) {
                  const fields_response = await github.graphql(
                    `query($projectId: ID!) {
                      node(id: $projectId) {
                        ... on ProjectV2 {
                          fields(first: 50) {
                            nodes {
                              ... on ProjectV2SingleSelectField {
                                id
                                name
                                options {
                                  id
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }`,
                    {projectId: project.id});
                  const type_field = fields_response.node.fields.nodes.find((field) => field.name === 'Type');
                  const task_option = type_field?.options?.find((option) => option.name === 'Task');
                  if (!type_field || !task_option) {
                    continue;
                  }
                  let item_id = existing_items.get(project.id);
                  if (!item_id) {
                    const add_response = await github.graphql(
                      `mutation($projectId: ID!, $issueId: ID!) {
                        addProjectV2ItemById(input: {projectId: $projectId, contentId: $issueId}) {
                          item {
                            id
                          }
                        }
                      }`,
                      {projectId: project.id, issueId: issue_node_id});
                    item_id = add_response.addProjectV2ItemById.item.id;
                  }
                  await github.graphql(
                    `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                      updateProjectV2ItemFieldValue(input: {
                        projectId: $projectId,
                        itemId: $itemId,
                        fieldId: $fieldId,
                        value: {singleSelectOptionId: $optionId}
                      }) {
                        projectV2Item {
                          id
                        }
                      }
                    }`,
                    {
                      projectId: project.id,
                      itemId: item_id,
                      fieldId: type_field.id,
                      optionId: task_option.id
                    });
                  console.log(`Set Type=Task for issue node ${issue_node_id} in project ${project.title}`);
                }
              } catch (error) {
                console.log(`Unable to set Type=Task for issue node ${issue_node_id}: ${error.message}`);
              }
            }
            // Get all issues that have these labels.
            const opts = github.rest.issues.listForRepo.endpoint.merge({
              ...context.issue,
              state: 'open',
              labels: label_array,
            });
            const issues = await github.paginate(opts);
            // Look for an existing issue with the same title.
            for (const issue of issues) {
              if (issue.title === title) {
                console.log(`Updating issue ${title}`);
                await github.rest.issues.createComment({
                  issue_number: issue.number,
                  owner,
                  repo,
                  body,
                });
                await set_issue_type_task(issue.node_id);
                return;
              }
            }
            // Existing issue not found, create a new one.
            console.log(`Creating issue ${title}`);
            const created_issue = await github.rest.issues.create({
              owner: owner,
              repo: repo,
              title: title,
              body: body,
              labels: label_array,
            });
            await set_issue_type_task(created_issue.data.node_id);
