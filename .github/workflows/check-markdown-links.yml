#
# This workflow checks Markdown files for broken links (internal, external,
# and fragment references). On PRs it only checks the Markdown files changed by
# the PR; pushes to main, the weekly schedule, and manual runs check every
# Markdown file to catch links that go stale over time.
---
name: Check Markdown links

on:
  push:
    branches:
      - main
    paths:
      - '**.md'

  pull_request:
    paths:
      - '**.md'

  # Permit manual runs of the workflow.
  workflow_dispatch:

  schedule:
    # Run weekly on Sundays at midnight UTC.
    - cron: "0 0 * * 0"

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check Markdown Links
        uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068  # v1.1.3
        with:
          # Bot-hostile sites (e.g. Slack invite pages) are ignored here.
          config-file: '.github/mlc_config.json'
          # On PRs only check the markdown files the PR touched, so pre-existing
          # link rot elsewhere doesn't block unrelated changes. Scheduled and
          # post-merge runs scan every markdown file to catch stale links.
          check-modified-files-only: ${{ github.event_name == 'pull_request' && 'yes' || 'no' }}
          base-branch: ${{ github.event.pull_request.base.ref || 'main' }}
